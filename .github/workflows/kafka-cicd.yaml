name: Kafka CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: kafka-with-jmx
  IMAGE_TAG: latest
  NAMESPACE: default
  RELEASE_NAME: kafka

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # -----------------------------
    # Docker Build & Push
    # -----------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # -----------------------------
    # Kubernetes Access
    # -----------------------------
    - name: Set up kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

    - name: Verify cluster access
      run: |
        kubectl get nodes

    # -----------------------------
    # Helm Deploy
    # -----------------------------
    - name: Setup Helm
      uses: azure/setup-helm@v4

    - name: Helm Upgrade Kafka
      run: |
        helm upgrade --install ${{ env.RELEASE_NAME }} ./helm/kafka \
          --namespace ${{ env.NAMESPACE }} \
          --set image.repository=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ env.IMAGE_TAG }}
