apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jmx-config
data:
  jmx-kafka.yaml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: "kafka.server<type=(.+), name=(.+)><>Value"
        name: kafka_server_$1_$2
        type: GAUGE
      - pattern: "kafka.network<type=(.+), name=(.+)><>Value"
        name: kafka_network_$1_$2
        type: GAUGE
      - pattern: "kafka.log<type=(.+), name=(.+)><>Value"
        name: kafka_log_$1_$2
        type: GAUGE
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          # 1️⃣ تغيير الصورة واستخدام سياسة السحب من الجهاز المحلي
          image: custom-kafka-with-jmx:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: controller
            - containerPort: 5556
              name: metrics
          env:
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.default.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.default.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: CLUSTER_ID
              value: "sHuQKxfDSmmAOSoezvzAcw"
            # 4️⃣ تعديل KAFKA_OPTS للمسار الجديد داخل الـ Custom Image
            - name: KAFKA_OPTS
              value: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=5556:/etc/jmx/jmx-kafka.yaml"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: jmx-config
              mountPath: /etc/jmx
      volumes:
        - name: jmx-config
          configMap:
            name: kafka-jmx-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi